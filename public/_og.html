<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0D0D0D; color:#F2F2F2;
         font-family:'Space Grotesk',sans-serif; overflow:hidden; position:relative; }

  .claqueta { position:absolute; top:0; left:0; right:0; height:12px; z-index:4;
              background:repeating-linear-gradient(90deg,#C6FF00 0 28px,#1E1E1E 28px 56px); }
  .rail { position:absolute; bottom:0; left:0; right:0; height:4px; background:#C6FF00; z-index:4; }

  .vf { position:absolute; inset:40px 36px 30px; z-index:5; pointer-events:none; }
  .vf i { position:absolute; width:30px; height:30px; border:1.5px solid rgba(242,242,242,.55); }
  .vf i:nth-child(1){ left:0; top:0; border-right:0; border-bottom:0; }
  .vf i:nth-child(2){ right:0; top:0; border-left:0; border-bottom:0; }
  .vf i:nth-child(3){ left:0; bottom:0; border-right:0; border-top:0; }
  .vf i:nth-child(4){ right:0; bottom:0; border-left:0; border-top:0; }
  .hud { position:absolute; font-size:11.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:500;
         color:rgba(242,242,242,.7); display:flex; align-items:center; gap:10px; }
  .hud.tr { right:46px; top:2px; } .hud.br { right:46px; bottom:2px; color:rgba(242,242,242,.6); }

  /* Four frames of real work, right side */
  .wall { position:absolute; top:12px; right:0; bottom:4px; width:620px; display:flex; gap:4px; z-index:1; }
  .wall div { flex:1; background-size:cover; background-position:center; }

  /* Scrim runs well past the wall edge so the photo strip never lands on a
     hard vertical seam against the flat background. */
  .scrim { position:absolute; top:12px; right:0; bottom:4px; left:0; z-index:2;
           background:linear-gradient(90deg,
             #0D0D0D 0%, #0D0D0D 49%, rgba(13,13,13,.92) 55%,
             rgba(13,13,13,.66) 64%, rgba(13,13,13,.40) 76%, rgba(13,13,13,.28) 100%); }

  .content { position:absolute; top:12px; bottom:4px; left:0; width:660px; z-index:3;
             padding:78px 0 64px 76px; display:flex; flex-direction:column; justify-content:space-between; }

  .eyebrow { display:flex; align-items:center; gap:11px;
             font-size:12.5px; letter-spacing:.24em; text-transform:uppercase; color:#8A8A8A; font-weight:500; }
  .dot { width:9px; height:9px; border-radius:50%; background:#C6FF00; display:block; flex:none; }

  /* Brand lockup: rec dot + wordmark. Set in Archivo Black, which is the face
     the wordmark itself is drawn from — so this matches the SVG exactly. */
  .mark { display:flex; align-items:center; gap:16px; margin:24px 0 30px;
          font-family:'Archivo Black',sans-serif; font-size:50px; line-height:1;
          letter-spacing:-.03em; }
  .mark .dot { width:14px; height:14px; }
  .mark b { font-weight:400; color:#F2F2F2; }
  .mark span { color:#C6FF00; }

  h1 { font-family:'Archivo Black',sans-serif; font-size:53px; line-height:1.02;
       letter-spacing:-.032em; max-width:12ch; }
  h1 em { font-style:normal; color:#C6FF00; }

  .foot { display:flex; align-items:baseline; gap:0; font-size:12.5px; letter-spacing:.18em;
          text-transform:uppercase; color:#F2F2F2; font-weight:500; }
  .foot i { font-style:normal; margin:0 14px; color:#3A3A3A; }
  .foot u { text-decoration:none; color:#6E6E6E; }
</style>
</head>
<body>
  <div class="claqueta"></div>

  <div class="wall">
    <div style="background-image:url('/work/yum/06.webp')"></div>
    <div style="background-image:url('/work/fxa-moda/01.webp')"></div>
    <div style="background-image:url('/work/kevin-florez/03.webp')"></div>
  </div>
  <div class="scrim"></div>

  <div class="vf">
    <i></i><i></i><i></i><i></i>
    <div class="hud tr"><span class="dot"></span>REC&nbsp; 00:00:12:07</div>
    <div class="hud br">A-CAM · 4K · 24 fps · kuadrafilm.com</div>
  </div>

  <div class="content">
    <div>
      <div class="eyebrow"><span class="dot"></span> Productora audiovisual · Bogotá, Colombia</div>
      <div class="mark">
        <span class="dot"></span><b>KUADRA</b><span>FILM</span>
      </div>
      <h1>Marcas que se ven como <em>lo que cobran.</em></h1>
    </div>

    <div class="foot">
      <span>Fotografía</span><i>/</i><span>Video</span><i>/</i><span>Dirección de arte</span>
    </div>
  </div>

  <div class="rail"></div>
</body>
</html>
